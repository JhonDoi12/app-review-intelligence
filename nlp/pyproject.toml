[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "review-nlp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=15",
  "google-play-scraper>=1.2",
  "langdetect>=1.0.9",
  "scikit-learn>=1.4",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
# model berat dipasang hanya saat diperlukan: pip install -e "./nlp[ml]"
ml = ["torch", "transformers", "datasets", "bertopic", "Sastrawi"]
dev = ["pytest", "ruff", "mypy"]
notebook = ["ipykernel", "matplotlib", "seaborn"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
review_nlp = ["preprocessing/*.csv"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["review_nlp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]